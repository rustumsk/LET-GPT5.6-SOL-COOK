name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect analyzable source
        id: source
        shell: bash
        run: |
          if find src -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit 2>/dev/null | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.source.outputs.present == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - if: steps.source.outputs.present == 'true'
        uses: github/codeql-action/autobuild@v3
      - if: steps.source.outputs.present == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          output: ../codeql-results
          upload: false
      - name: Enforce CodeQL findings
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          if jq -e '[.runs[].results[]? | select(.level == "error" or .level == "warning")] | length == 0' ../codeql-results/*.sarif >/dev/null; then
            echo "CodeQL found no warning or error results."
          else
            echo "CodeQL found security results that require review."
            jq -r '.runs[].results[]? | select(.level == "error" or .level == "warning") | "\(.level): \(.ruleId): \(.message.text)"' ../codeql-results/*.sarif
            exit 1
          fi
